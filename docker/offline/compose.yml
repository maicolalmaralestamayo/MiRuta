# MiRuta sin Internet: usa las imágenes cargadas con
#   docker load -i miruta-2.1.0-imagenes.tar.gz
# y se arranca con
#   docker compose -f compose.yml up
#
# - API:            http://localhost:8000/api/v1   (desde un teléfono: http://IP-DEL-PC:8000)
# - Documentación:  http://localhost:8000/docs
# - Base de datos:  MariaDB en el puerto 3307 del PC (usuario y contraseña: miruta)
#
# Las claves de abajo son SOLO para pruebas. No usar en el servidor real.
name: miruta

services:
  db:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: miruta
      MARIADB_USER: miruta
      MARIADB_PASSWORD: miruta
    ports:
      - "3307:3306"
    volumes:
      - db:/var/lib/mysql

  api:
    image: miruta-api:2.1.0
    environment: &env
      APP_NAME: MiRuta
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: America/Havana
      APP_KEY: base64:bWlydXRhLWRldi1jbGF2ZS1kZS1wcnVlYmFzLTEyMzQ=
      JWT_SECRET: miruta-dev-jwt-solo-para-pruebas-0123456789abcdef
      DOCS_ENABLED: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: miruta
      DB_USERNAME: miruta
      DB_PASSWORD: miruta
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      - db

  # Tareas programadas (viajes realizados, atrasos, avisos, chats…), cada minuto.
  scheduler:
    image: miruta-api:2.1.0
    environment:
      <<: *env
      ROLE: scheduler
    depends_on:
      - api

volumes:
  db:
  uploads:
