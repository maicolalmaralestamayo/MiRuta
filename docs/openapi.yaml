            body:
              type: string
              writeOnly: true
              description: 'Solo al abrirla sin cuenta: primer mensaje'
            createdAt:
              type: string
              format: date-time
              readOnly: true
            lastMessageAt:
              type: string
              format: date-time
              nullable: true
              readOnly: true
        relationships:
          type: object
          properties:
            topic:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
            openedBy:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
            itinerary:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
            entity:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
            installation:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
        links:
          $ref: '#/components/schemas/Links'
    ConversationDocument:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Conversation'
        included:
          type: array
          items:
            type: object
            additionalProperties: true
    ConversationCollection:
