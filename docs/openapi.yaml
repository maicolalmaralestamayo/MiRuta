  /statistics/{name}:
    get:
      tags:
      - Estadísticas
      summary: Obtener una estadística
      description: 'Un solo tipo de periodo: `from`+`to`, `dates` o `last`. Cada uno ve lo de su Entidad (el Administrador,
        todas o una con `entity`); los filtros se restringen según el rol.'
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          enum:
          - trips-by-status
          - punctuality
          - duration
          - trips-by-driver
          - trips-by-vehicle
          - overloaded-trips
          - occupancy
          - attendance
          - children-transported
          - workers-distribution
          - worker-trips
          - applications-summary
          - stop-activity
          - stop-pass-times
          - distance
          - live-trip
      - name: filter[from]
        in: query
        required: false
        description: Desde
        schema:
          type: string
          format: date
      - name: filter[to]
        in: query
        required: false
        description: Hasta
        schema:
          type: string
          format: date
      - name: filter[dates]
        in: query
        required: false
        description: Fechas explícitas separadas por comas
        schema:
          type: string
      - name: filter[last]
        in: query
        required: false
        description: 'Relativo: número + d/w/m/y (p. ej. 7d, 3m)'
        schema:
          type: string
          pattern: ^\d+[dwmy]$
      - name: filter[entity]
        in: query
        required: false
        description: Id de Entidad (Administrador)
        schema:
          type: string
      - name: filter[level]
        in: query
        required: false
        description: 'overloaded-trips: saturated (por defecto) u overloaded'
        schema:
          type: string
      - name: filter[itinerary]
        in: query
        required: false
        description: Id de itinerario
        schema:
          type: string
      - name: filter[vehicle]
        in: query
        required: false
        description: Id de vehículo
        schema:
          type: string
      - name: filter[driver]
        in: query
        required: false
        description: Id de chofer
        schema:
          type: string
      - name: filter[stop]
        in: query
        required: false
        description: Id de parada
        schema:
          type: string
      - name: filter[worker]
        in: query
        required: false
        description: Id de trabajador
        schema:
          type: string
      - name: filter[trip]
        in: query
        required: false
        description: Id de viaje (live-trip)
        schema:
          type: string
      - name: filter[by]
        in: query
        required: false
        description: 'Agrupación: itinerary, vehicle, driver (punctuality, occupancy) o itinerary, stop, rank, sex (workers-distribution)'
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/StatisticDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /app-versions/latest:
    get:
      tags:
      - Actualizaciones
      summary: Última versión de la app
      description: 'Público. `data` es null si no hay ninguna. Con `filter[currentVersionCode]`, `meta.updateAvailable` y
        `meta.mandatory`. Con `filter[abis]` (los que admite el teléfono, por preferencia), `meta.file` trae el APK que le
        corresponde: el suyo, si no el universal, si no el único publicado.'
      parameters:
      - name: filter[currentVersionCode]
        in: query
        required: false
        description: versionCode instalado
        schema:
          type: integer
      - name: filter[abis]
        in: query
        required: false
        description: p. ej. arm64-v8a,armeabi-v7a
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AppVersionDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /app-versions:
    get:
      tags:
      - Actualizaciones
      summary: Versiones publicadas
      description: Solo el Administrador. `meta.usersWithoutVersion`.
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AppVersionCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Actualizaciones
      summary: Publicar una versión
      description: Solo el Administrador. `multipart/form-data`. Un APK por tipo de procesador (al menos uno). El versionCode
        debe ser mayor que el de cualquier versión anterior.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - versionName
              - versionCode
              properties:
                apkArm64:
                  type: string
                  format: binary
                  description: 64 bits
                apkArm32:
                  type: string
                  format: binary
                  description: 32 bits
                apkUniversal:
                  type: string
                  format: binary
                versionName:
                  type: string
                versionCode:
                  type: integer
                notes:
                  type: string
                mandatory:
                  type: boolean
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AppVersionDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /app-versions/{id}:
    delete:
      tags:
      - Actualizaciones
      summary: Retirar una versión
      description: Solo el Administrador. Borra también el archivo.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /operations:
    post:
      tags:
      - Lote
      summary: Operaciones atómicas (JSON:API Atomic Operations)
      description: Crear viajes por rango, confirmar o desconfirmar en masa, enviar posiciones acumuladas. O se aplican todas
        o ninguna.
      requestBody:
        required: true
        content:
          application/vnd.api+json; ext="https://jsonapi.org/ext/atomic":
            schema:
              $ref: '#/components/schemas/AtomicRequest'
      responses:
        '200':
          description: Todas aplicadas
          content:
            application/vnd.api+json; ext="https://jsonapi.org/ext/atomic":
              schema:
                $ref: '#/components/schemas/AtomicResponse'
        '204':
          description: Todas aplicadas, sin resultados
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    PageNumber:
      name: page[number]
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Sort:
      name: sort
      in: query
      description: Campos separados por comas; `-` delante para orden descendente
      schema:
        type: string
    Include:
      name: include
      in: query
      description: Relaciones a incluir, separadas por comas
      schema:
        type: string
  responses:
    BadRequest:
      description: Petición mal formada
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Forbidden:
      description: Sin permiso
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    NotFound:
      description: No encontrado
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Conflict:
      description: Conflicto (duplicado, solapamiento, transición no permitida…)
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    UnsupportedMediaType:
      description: Falta el tipo de contenido JSON:API
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Unprocessable:
      description: Error de validación
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    TooManyRequests:
      description: Demasiadas solicitudes o mensajes desde ese teléfono en la última hora
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
  schemas:
    ResourceIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
        id:
          type: string
    Links:
      type: object
      properties:
        self:
          type: string
          format: uri
          nullable: true
        first:
          type: string
          format: uri
          nullable: true
        prev:
          type: string
          format: uri
          nullable: true
        next:
          type: string
          format: uri
          nullable: true
        last:
          type: string
          format: uri
          nullable: true
    PageMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
    Position:
      type: object
      nullable: true
      properties:
        latitude:
          type: number
        longitude:
          type: number
        at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        status:
          type: string
        code:
          type: string
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              type: string
            parameter:
              type: string
        meta:
          type: object
          additionalProperties: true
    ErrorDocument:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    AtomicOperation:
      type: object
      required:
      - op
      properties:
        op:
          type: string
          enum:
          - add
          - update
          - remove
        ref:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
            relationship:
              type: string
        data:
          type: object
          additionalProperties: true
    AtomicRequest:
      type: object
      required:
      - atomic:operations
      properties:
        atomic:operations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AtomicOperation'
    AtomicResponse:
      type: object
      properties:
        atomic:results:
          type: array
          items:
            type: object
            properties:
              data:
                type: object
                additionalProperties: true
    User:
      type: object
      description: Cuenta de la app. El Administrador es una cuenta sin trabajador. El usuario y los datos de la contraseña
        solo los ven la propia cuenta y el Administrador.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - users
        id:
          type: string
        attributes:
          type: object
          properties:
            username:
              type: string
              pattern: ^[a-z][a-z0-9._]{3,19}$
              description: De 4 a 20 caracteres, empieza por letra, sin signos al final ni seguidos, al menos 3 letras, sin
                palabras reservadas ni no permitidas. Único en toda la app; el anterior queda bloqueado `username_reuse_block_days`
                días.
            password:
              type: string
              format: password
              writeOnly: true
              description: Según la política de contraseñas (GET /password-policy)
            firstName:
              type: string
              maxLength: 50
            middleName:
              type: string
              maxLength: 50
            firstSurname:
              type: string
              maxLength: 50
            secondSurname:
              type: string
              maxLength: 50
            fullName:
              type: string
              readOnly: true
            photoUrl:
              type: string
              format: uri
              nullable: true
              readOnly: true
            isAdmin:
              type: boolean
              readOnly: true
            active:
              type: boolean
              description: Falso = borrado lógico. Solo el Administrador puede cambiarlo.
            activated:
              type: boolean
