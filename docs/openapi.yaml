        included:
          type: array
          items:
            type: object
            additionalProperties: true
        links:
          $ref: '#/components/schemas/Links'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Conversation:
      type: object
      description: Conversación con los jefes o con el desarrollador.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - conversations
        id:
          type: string
        attributes:
          type: object
