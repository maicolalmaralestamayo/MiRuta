      required:
      - type
      properties:
        type:
          type: string
          enum:
          - statistics
        id:
          type: string
        attributes:
          type: object
          properties:
            columns:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  label:
                    type: string
                  type:
                    type: string
                    enum:
                    - string
                    - integer
                    - number
                    - date
                    - datetime
                    - percent
            rows:
              type: array
              items:
                type: object
                additionalProperties: true
        links:
