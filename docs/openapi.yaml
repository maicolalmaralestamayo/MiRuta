              type: string
              enum:
              - application_received
              - application_resolved
              - role_assigned
              - role_removed
              - resignation
              - inactivity_warning
              - inactivity_removal
              - trip_needs_reassignment
              - access_recovery_requested
              - password_expiring
              readOnly: true
            readAt:
              type: string
              format: date-time
              nullable: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
        relationships:
          type: object
          properties:
            application:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
            trip:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
            accessRecovery:
              type: object
