openapi: 3.0.3
info:
  title: MiRuta API
  version: 3.0.0
  description: 'API de MiRuta: gestión del transporte de trabajadores.


    - Formato [JSON:API 1.1](https://jsonapi.org/format/) (`application/vnd.api+json`).

    - Autenticación JWT (RFC 7519): token de acceso de 30 min y de renovación de 90 días con rotación.

    - La persona pertenece a 0..n Entidades. Lo que puede hacer lo dan sus roles configurables (operación + ámbito: own, itinerary,
    entity, all; GET /me → meta.permissions). El Administrador puede todo.

    - QR de la persona (dinámico MR1 y impreso MRP1): ver la etiqueta QR y docs/07-algoritmos.md §7.31.

    - Sin cuenta, la app se identifica con la cabecera X-Installation (POST /installations).

    - Documentación funcional en `docs/`.'
servers:
- url: https://{host}/api/v1
  variables:
    host:
      default: localhost
security:
- bearerAuth: []
tags:
- name: Autenticación
- name: Cuentas
- name: Sin cuenta
- name: Personas
- name: Perfil
- name: Entidades
- name: Roles
- name: Solicitudes
- name: Ausencias
- name: Hijos
- name: Nomencladores
- name: Itinerarios y paradas
- name: Mapas
- name: Vehículos
- name: Viajes
- name: Recorrido
- name: Subida
- name: QR
- name: Chats
- name: Avisos
- name: Ajustes
- name: Estadísticas
- name: Mantenimiento
- name: Actualizaciones
- name: Lote
paths:
  /tokens:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: Usuario + contraseña. Devuelve token de acceso y de renovación. Si la persona no tenía teléfono (`hasPhone`
        falso), pasa a tenerlo y su QR impreso se anula. Con X-Installation, la instalación y sus conversaciones sin cuenta
        pasan a la cuenta.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/TokenDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
    delete:
      tags:
      - Autenticación
      summary: Cerrar sesión en todos los dispositivos
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tokens/refresh:
    post:
      tags:
      - Autenticación
      summary: Renovar tokens
      description: Envía `attributes.refreshToken` (rotación).
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/TokenDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
  /tokens/current:
    delete:
      tags:
      - Autenticación
      summary: Cerrar sesión en este dispositivo
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /password-policy:
    get:
      tags:
      - Cuentas
      summary: Requisitos de la contraseña y del usuario
      description: Público.
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PasswordPolicyDocument'
      security: []
  /registration-status:
    get:
      tags:
      - Cuentas
      summary: ¿Ya hay Administrador?
      description: Público. Solo responde sí o no.
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RegistrationStatusDocument'
      security: []
  /username-suggestion:
    get:
      tags:
      - Cuentas
      summary: Usuario propuesto
      description: Público. primer nombre → +.segundo nombre → +.primer apellido → +.segundo apellido → +.2, .3… (minúsculas,
        sin tildes, ñ→n), mientras esté ocupado o no sea válido.
      parameters:
      - name: firstName
        in: query
        required: true
        schema:
          type: string
      - name: middleName
        in: query
        required: false
        schema:
          type: string
      - name: firstSurname
        in: query
        required: true
        schema:
          type: string
      - name: secondSurname
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UsernameSuggestionDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /password-suggestion:
    get:
      tags:
      - Cuentas
      summary: Contraseña propuesta
      description: Público. Cumple la política.
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PasswordSuggestionDocument'
      security: []
  /users:
    post:
      tags:
      - Cuentas
      summary: Registrarse
      description: 'Público. Nombres, apellidos, carné, usuario y contraseña; sin Entidad. Si no hay Administrador, el primero
        lo es (con bloqueo). Errores: 409 IDENTITY_CARD_TAKEN (texto de docs/11 §11.5), 422 IDENTITY_CARD_INVALID, USERNAME_INVALID,
        409 USERNAME_TAKEN, 422 PASSWORD_POLICY.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UserDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
    get:
      tags:
      - Personas
      summary: Listar personas
      description: 'La propia, las de su ámbito de workers.view y los solicitantes visibles (con «all»: todas).'
      parameters:
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Include'
      - name: filter[search]
        in: query
        required: false
        description: Nombres, usuario o carné exacto
        schema:
          type: string
      - name: filter[active]
        in: query
        required: false
        description: true, false o all
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{id}:
    get:
      tags:
      - Personas
      summary: Obtener persona
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Personas
      summary: Eliminar o reactivar la cuenta
      description: workers.delete. Atributo `active`. 409 LAST_ADMIN.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UserDocument'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /users/{userId}/settings:
    get:
      tags:
      - Ajustes
      summary: Ajustes de un trabajador
      description: settings.worker sobre alguna de sus pertenencias (Entidad o itinerario); también la propia persona.
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserSettingCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/settings/{id}:
    patch:
      tags:
      - Ajustes
      summary: Cambiar un ajuste de un trabajador
      description: settings.worker. `id` = clave.
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UserSettingDocument'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserSettingDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags:
      - Ajustes
      summary: Volver al valor heredado
      description: settings.worker.
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /me:
    get:
      tags:
      - Perfil
      summary: Mi persona
      description: Con `meta.permissions` y `meta.memberships`.
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Perfil
      summary: Modificar mi persona
      description: Nombres, carné, usuario y contraseña (con `meta.currentPassword`, salvo must_change_password).
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UserDocument'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /me/entities:
    post:
      tags:
      - Perfil
      summary: Unirme a una Entidad (Administrador)
      description: 'Solo el Administrador entra sin solicitud: relationships.entity o attributes.entityAbbreviation. Los demás
        lo solicitan (applications).'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/WorkerDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorkerDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /me/entities/{entityId}:
    delete:
      tags:
      - Perfil
      summary: Darme de baja de una Entidad
      description: Borra itinerario, parada y roles en esa Entidad.
      parameters:
      - name: entityId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/photo:
    post:
      tags:
      - Perfil
      summary: Subir foto de perfil
      description: '`multipart/form-data` (campo `photo`), máx. `photo_max_kb`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - photo
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags:
      - Perfil
      summary: Quitar foto de perfil
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/settings:
    get:
      tags:
      - Ajustes
      summary: Mis ajustes
      description: Valor efectivo y heredado de cada ajuste personalizable.
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserSettingCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/settings/{id}:
    patch:
      tags:
      - Ajustes
      summary: Cambiar un ajuste propio
      description: '`id` = clave.'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UserSettingDocument'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserSettingDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags:
      - Ajustes
      summary: Volver al valor heredado
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /installations:
    post:
      tags:
      - Sin cuenta
      summary: Registrar la instalación de la app
      description: Público. Devuelve en meta.header el valor de X-Installation (solo esta vez).
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/InstallationDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/InstallationDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
  /installations/{id}:
    get:
      tags:
      - Sin cuenta
      summary: Obtener instalación
      description: access_recoveries.manage.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/InstallationDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Sin cuenta
      summary: Bloquear o desbloquear una instalación
      description: access_recoveries.manage.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/InstallationDocument'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/InstallationDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /guest/access-recoveries:
    post:
      tags:
      - Sin cuenta
      summary: Olvidé algo
      description: Con X-Installation. Usuario, contraseña o los dos; carné y teléfono. Límite por hora (429).
      parameters:
      - name: X-Installation
        in: header
        required: true
        schema:
          type: string
        description: <id>.<secreto> de la instalación (POST /installations)
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AccessRecoveryDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AccessRecoveryDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /guest/access-recoveries/{id}:
    get:
      tags:
      - Sin cuenta
      summary: Estado de mi solicitud
      description: 'Con X-Installation. Si se aprobó: `username` y/o `password` (solo lo pedido) y la solicitud termina.'
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: X-Installation
        in: header
        required: true
        schema:
          type: string
        description: <id>.<secreto> de la instalación (POST /installations)
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AccessRecoveryDocument'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /access-recoveries:
    get:
      tags:
      - Sin cuenta
      summary: Solicitudes «Olvidé algo»
      description: access_recoveries.manage.
      parameters:
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Include'
      - name: filter[status]
        in: query
        required: false
        description: Estados separados por comas
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AccessRecoveryCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /access-recoveries/{id}:
    get:
      tags:
      - Sin cuenta
      summary: Obtener solicitud
      description: access_recoveries.manage.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AccessRecoveryDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Sin cuenta
      summary: Aprobar o rechazar
      description: access_recoveries.manage. Al aprobar se propone contraseña (must_change_password).
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AccessRecoveryDocument'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AccessRecoveryDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /guest/conversations:
    get:
      tags:
      - Sin cuenta
      summary: Mis conversaciones sin cuenta
      description: Con X-Installation.
      parameters:
      - name: X-Installation
        in: header
        required: true
        schema:
          type: string
        description: <id>.<secreto> de la instalación (POST /installations)
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ConversationCollection'
      security: []
    post:
      tags:
      - Sin cuenta
      summary: Escribir al desarrollador sin cuenta
      description: Con X-Installation.
      parameters:
      - name: X-Installation
        in: header
        required: true
        schema:
          type: string
        description: <id>.<secreto> de la instalación (POST /installations)
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ConversationDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ConversationDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
