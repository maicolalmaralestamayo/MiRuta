    AppVersion:
      type: object
      description: Versión de la app publicada por el Administrador.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - app-versions
        id:
          type: string
        attributes:
          type: object
          properties:
            versionName:
              type: string
            versionCode:
              type: integer
            notes:
              type: string
              nullable: true
            mandatory:
              type: boolean
            files:
              type: array
              readOnly: true
              items:
                type: object
                properties:
                  abi:
                    type: string
                    enum:
                    - arm64-v8a
                    - armeabi-v7a
                    - universal
                  downloadUrl:
                    type: string
                    format: uri
                  sizeBytes:
                    type: integer
                  sha256:
                    type: string
            publishedAt:
              type: string
              format: date-time
        meta:
          type: object
          readOnly: true
          properties:
            installedCount:
              type: integer
              description: Solo para el Administrador
        links:
          $ref: '#/components/schemas/Links'
    AppVersionDocument:
      type: object
      required:
      - data
