        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    PageNumber:
      name: page[number]
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Sort:
      name: sort
      in: query
      description: Campos separados por comas; `-` delante para orden descendente
      schema:
        type: string
    Include:
      name: include
      in: query
      description: Relaciones a incluir, separadas por comas
      schema:
        type: string
  responses:
    BadRequest:
      description: Petición mal formada
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Forbidden:
      description: Sin permiso
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    NotFound:
      description: No encontrado
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Conflict:
      description: Conflicto (duplicado, solapamiento, transición no permitida…)
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    UnsupportedMediaType:
      description: Falta el tipo de contenido JSON:API
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Unprocessable:
      description: Error de validación
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    TooManyRequests:
      description: Demasiadas solicitudes o mensajes desde ese teléfono en la última hora
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
  schemas:
    ResourceIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
        id:
          type: string
    Links:
      type: object
      properties:
        self:
          type: string
          format: uri
          nullable: true
        first:
          type: string
          format: uri
          nullable: true
        prev:
          type: string
          format: uri
          nullable: true
        next:
          type: string
          format: uri
          nullable: true
        last:
          type: string
          format: uri
          nullable: true
    PageMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
    Position:
      type: object
      nullable: true
      properties:
        latitude:
          type: number
        longitude:
          type: number
        at:
          type: string
          format: date-time
    BoundingBox:
      type: object
      properties:
        south:
          type: number
        west:
          type: number
        north:
          type: number
        east:
          type: number
    Error:
      type: object
      properties:
        status:
          type: string
        code:
          type: string
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              type: string
            parameter:
              type: string
        meta:
          type: object
          additionalProperties: true
    ErrorDocument:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    AtomicOperation:
      type: object
      required:
      - op
      properties:
        op:
          type: string
          enum:
          - add
          - update
          - remove
        ref:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
            relationship:
              type: string
        data:
          type: object
          additionalProperties: true
    AtomicRequest:
      type: object
      required:
      - atomic:operations
      properties:
        atomic:operations:
          type: array
          minItems: 1
          items:
