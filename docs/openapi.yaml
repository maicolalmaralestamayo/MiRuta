  /statistics/{name}:
    get:
      tags:
      - Estadísticas
      summary: Obtener una estadística
      description: 'Un solo tipo de periodo: `from`+`to`, `dates` o `last`. statistics.view por ámbito; sin él, quien conduce
        las de sus viajes y cualquiera las suyas (worker-trips, live-trip). `outsider-travellers`: trabajadores que viajan
        fuera de su itinerario o de su Entidad. `children-transported`: niños que viajan realmente (marcados al subir), distintos
        y con derecho declarados.'
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          enum:
          - trips-by-status
          - punctuality
          - duration
          - trips-by-driver
          - trips-by-vehicle
          - overloaded-trips
          - occupancy
          - attendance
          - children-transported
          - workers-distribution
          - worker-trips
          - applications-summary
          - stop-activity
          - stop-pass-times
          - distance
          - live-trip
          - trip-incidents
          - outsider-travellers
      - name: filter[from]
        in: query
        required: false
        description: Desde
        schema:
          type: string
          format: date
      - name: filter[to]
        in: query
        required: false
        description: Hasta
        schema:
          type: string
          format: date
      - name: filter[dates]
        in: query
        required: false
        description: Fechas separadas por comas
        schema:
          type: string
      - name: filter[last]
        in: query
        required: false
        description: Número + d/w/m/y (p. ej. 7d)
        schema:
          type: string
          pattern: ^\d+[dwmy]$
      - name: filter[entity]
        in: query
        required: false
        description: Id de Entidad
        schema:
          type: string
      - name: filter[level]
        in: query
        required: false
        description: 'overloaded-trips: saturated u overloaded'
        schema:
          type: string
      - name: filter[itinerary]
        in: query
        required: false
        description: Id de itinerario
        schema:
          type: string
      - name: filter[vehicle]
        in: query
        required: false
        description: Id de vehículo
        schema:
          type: string
      - name: filter[driver]
        in: query
        required: false
        description: Id de pertenencia del chofer
        schema:
          type: string
      - name: filter[stop]
        in: query
        required: false
        description: Id de parada
        schema:
          type: string
      - name: filter[worker]
        in: query
        required: false
        description: Id de pertenencia
        schema:
          type: string
      - name: filter[trip]
        in: query
        required: false
        description: Id de viaje (live-trip)
        schema:
          type: string
      - name: filter[by]
        in: query
        required: false
        description: itinerary, vehicle, driver (punctuality, occupancy) o itinerary, stop, sex (workers-distribution)
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/StatisticDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
