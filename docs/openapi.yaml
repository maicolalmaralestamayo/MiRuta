openapi: 3.0.3
info:
  title: MiTransporte API
  version: 1.0.0
  description: 'API de MiTransporte: gestión del transporte de trabajadores.


    - Formato [JSON:API 1.1](https://jsonapi.org/format/) (`application/vnd.api+json`).

    - Autenticación JWT (RFC 7519): token de acceso de 30 min y de renovación de 90 días con rotación.

    - Documentación funcional en `docs/`.'
servers:
- url: https://{host}/api/v1
  variables:
    host:
      default: localhost
security:
- bearerAuth: []
tags:
- name: Autenticación
- name: Trabajadores
- name: Perfil
- name: Nomencladores
- name: Itinerarios y paradas
- name: Roles
- name: Vehículos
- name: Viajes
- name: Recorrido
- name: Subida
- name: Hijos
- name: Solicitudes
- name: Chats
- name: Avisos
- name: Ajustes
- name: Estadísticas
- name: Lote
paths:
  /tokens:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: Carné + contraseña. Devuelve token de acceso (30 min) y de renovación (90 días).
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/TokenDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
    delete:
      tags:
      - Autenticación
      summary: Cerrar sesión en todos los dispositivos
      description: Revoca todos los tokens de renovación del usuario.
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tokens/refresh:
    post:
      tags:
      - Autenticación
      summary: Renovar tokens
      description: Envía `attributes.refreshToken`. Devuelve un par nuevo y revoca el token de renovación usado (rotación).
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/TokenDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
  /tokens/current:
    delete:
      tags:
      - Autenticación
      summary: Cerrar sesión en este dispositivo
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workers:
    post:
      tags:
      - Trabajadores
      summary: Registrarse
      description: Público. Carné, nombre, apellidos, jerarquía (relación `rank`) y contraseña. El primer usuario registrado
        pasa a ser Administrador.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/WorkerDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorkerDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
    get:
      tags:
      - Trabajadores
      summary: Listar trabajadores
      description: Solo datos públicos, salvo para el Administrador.
      parameters:
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Include'
      - name: filter[itinerary]
        in: query
        required: false
        description: Id de itinerario
        schema:
          type: string
      - name: filter[stop]
        in: query
        required: false
        description: Id de parada
        schema:
          type: string
      - name: filter[rank]
        in: query
        required: false
        description: Id de jerarquía
        schema:
          type: string
      - name: filter[active]
        in: query
        required: false
        description: true/false (solo Administrador)
        schema:
          type: boolean
      - name: filter[search]
        in: query
        required: false
        description: Texto en nombre o apellidos
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorkerCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workers/{id}:
    get:
      tags:
      - Trabajadores
      summary: Obtener trabajador
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorkerDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Trabajadores
      summary: Activar o desactivar trabajador
      description: Solo el Administrador. Atributo `active`.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/WorkerDocument'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorkerDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /me:
    get:
      tags:
      - Perfil
      summary: Mi perfil
      description: Incluye `cardNumber`.
      parameters:
      - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorkerDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Perfil
      summary: Modificar mi perfil
      description: Nombre, apellidos o contraseña. Para cambiar la contraseña hay que enviar también `meta.currentPassword`;
        al cambiarla se revocan todos los tokens de renovación.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/WorkerDocument'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorkerDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /me/photo:
    post:
      tags:
      - Perfil
      summary: Subir foto de perfil
      description: 'Excepción al formato JSON:API: `multipart/form-data`. JPG o PNG, tamaño máximo según el ajuste `photo_max_kb`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - photo
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorkerDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags:
      - Perfil
      summary: Quitar foto de perfil
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/settings:
    get:
      tags:
      - Ajustes
      summary: Mis ajustes
      description: Valor efectivo de cada ajuste que el usuario puede personalizar.
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
