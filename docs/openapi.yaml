openapi: 3.0.3
info:
  title: MiRuta API
  version: 4.0.0
  description: 'API de MiRuta (Laravel 12): gestión del transporte de trabajadores.


    - Formato [JSON:API 1.1](https://jsonapi.org/format/) (`application/vnd.api+json`).

    - Autenticación JWT (RFC 7519) con token de renovación y rotación.

    - Tres roles fijos: Administrador, Jefe de itinerario y Trabajador.

    - Cabecera `X-App-Version` en cada petición: con una actualización obligatoria pendiente, 426 APP_UPDATE_REQUIRED.

    - Detalle de reglas y errores: `docs/13-api-proxima-version.md`.'
servers:
- url: https://{host}/api/v1
  variables:
    host:
      default: localhost
security:
- bearerAuth: []
tags:
- name: Cuenta
- name: Gestión
- name: Hijos
- name: Nomencladores
- name: QR
- name: Viajes
- name: Sincronización
- name: Conversaciones
- name: Ajustes
- name: Actualizaciones
- name: Olvidé algo
- name: Mantenimiento
paths:
  /registration-status:
    get:
      tags:
      - Cuenta
      summary: ¿Ya hay Administrador?
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RegistrationStatusDocument'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      security: []
  /username-suggestion:
    get:
      tags:
      - Cuenta
      summary: Usuario propuesto
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UsernameSuggestionDocument'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      parameters:
      - name: firstName
        in: query
        required: true
        schema:
          type: string
      - name: middleName
        in: query
        required: false
        schema:
          type: string
      - name: firstSurname
        in: query
        required: false
        schema:
          type: string
      - name: secondSurname
        in: query
        required: false
        schema:
          type: string
      security: []
  /password-suggestion:
    get:
      tags:
      - Cuenta
      summary: Contraseña propuesta
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PasswordSuggestionDocument'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      security: []
  /password-policy:
    get:
      tags:
      - Cuenta
      summary: Política de contraseñas
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PasswordPolicyDocument'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      security: []
  /users:
    post:
      tags:
      - Cuenta
      summary: Registrarse
      responses:
        '201':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: Público. El primero que se registra es el Administrador.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UserDocument'
      security: []
    get:
      tags:
      - Gestión
      summary: Listar users
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      parameters:
      - name: filter[entity]
        in: query
        required: false
        description: Id de Entidad o none
        schema:
          type: string
      - name: filter[itinerary]
        in: query
        required: false
        description: Id o none
        schema:
          type: string
      - name: filter[stop]
        in: query
        required: false
        description: Id o none
        schema:
          type: string
      - name: filter[search]
        in: query
        required: false
        description: Nombre, usuario o carné
        schema:
          type: string
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Include'
  /tokens:
    post:
      tags:
      - Cuenta
      summary: Iniciar sesión
      responses:
        '201':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: 'Con una actualización obligatoria pendiente: 426.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/TokenDocument'
      security: []
    delete:
      tags:
      - Cuenta
      summary: Cerrar todas las sesiones
      responses:
        '204':
          description: Hecho, sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tokens/refresh:
    post:
      tags:
      - Cuenta
      summary: Renovar los tokens
      responses:
        '201':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: 'Rotación: reutilizar uno usado cierra todas las sesiones.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/TokenDocument'
      security: []
  /tokens/current:
    delete:
      tags:
      - Cuenta
      summary: Cerrar esta sesión
      responses:
        '204':
          description: Hecho, sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      tags:
      - Cuenta
      summary: Mi persona
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: meta.role, meta.chiefItineraryId y meta.memberships.
    patch:
      tags:
      - Cuenta
      summary: Cambiar mis datos o mi contraseña
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: Para la contraseña, meta.currentPassword.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UserDocument'
  /me/photo:
    post:
      tags:
      - Cuenta
      summary: Subir mi foto
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
    delete:
      tags:
      - Cuenta
      summary: Quitar mi foto
      responses:
        '204':
          description: Hecho, sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpdateRequired'
  /me/applications-seen:
    post:
      tags:
      - Cuenta
      summary: Marcar vistas mis solicitudes resueltas
      responses:
        '204':
          description: Hecho, sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpdateRequired'
  /entities:
    get:
      tags:
      - Gestión
      summary: Listar entities
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      parameters:
      - name: filter[search]
        in: query
        required: false
        description: Abreviatura o nombre
        schema:
          type: string
      - name: filter[active]
        in: query
        required: false
        description: true o false
        schema:
          type: string
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Include'
    post:
      tags:
      - Gestión
      summary: Crear entities
      responses:
        '201':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: Administrador.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/EntityDocument'
  /entities/{id}:
    get:
      tags:
      - Gestión
      summary: Ver entities
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags:
      - Gestión
      summary: Modificar entities
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: Administrador.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/EntityDocument'
    delete:
      tags:
      - Gestión
      summary: Eliminar entities
      responses:
        '204':
          description: Hecho, sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: Administrador. Elimina sus itinerarios; las personas quedan sin esa Entidad.
      parameters:
      - $ref: '#/components/parameters/Id'
  /entities/lookup:
    get:
      tags:
      - Gestión
      summary: Comprobar una abreviatura
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityLookupDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: Con sesión o X-Installation.
      parameters:
      - name: filter[abbreviation]
        in: query
        required: false
        description: Abreviatura
        schema:
          type: string
  /itineraries:
    get:
      tags:
      - Gestión
      summary: Listar itineraries
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ItineraryCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      parameters:
      - name: filter[entity]
        in: query
        required: false
        description: Id de Entidad
        schema:
          type: string
      - name: filter[search]
        in: query
        required: false
        description: Nombre
        schema:
          type: string
      - name: filter[active]
        in: query
        required: false
        description: true o false
        schema:
          type: string
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Include'
    post:
      tags:
      - Gestión
      summary: Crear itineraries
      responses:
        '201':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ItineraryDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: Administrador.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ItineraryDocument'
  /itineraries/{id}:
    get:
      tags:
      - Gestión
      summary: Ver itineraries
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ItineraryDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags:
      - Gestión
      summary: Modificar itineraries
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ItineraryDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: 'Administrador. Con relationships.entity: cambiar de Entidad.'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ItineraryDocument'
    delete:
      tags:
      - Gestión
      summary: Eliminar itineraries
      responses:
        '204':
          description: Hecho, sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: Administrador. Sus personas quedan sin itinerario.
      parameters:
      - $ref: '#/components/parameters/Id'
  /itineraries/{id}/relationships/stops:
    patch:
      tags:
      - Gestión
      summary: Ordenar las paradas del itinerario
      responses:
        '200':
          description: Nuevo orden
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Identifier'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: Administrador o Jefe del itinerario. data = todas sus paradas en orden.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Identifier'
  /stops:
    get:
      tags:
      - Gestión
      summary: Listar stops
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/StopCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      parameters:
      - name: filter[itinerary]
        in: query
        required: false
        description: Id de itinerario o none
        schema:
          type: string
      - name: filter[entity]
        in: query
        required: false
        description: Id de Entidad
        schema:
          type: string
      - name: filter[search]
        in: query
        required: false
        description: Punto de referencia o calle
        schema:
          type: string
      - name: filter[active]
        in: query
        required: false
        description: true o false
        schema:
          type: string
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Include'
    post:
      tags:
      - Gestión
      summary: Crear stops
      responses:
        '201':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/StopDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: Administrador; Jefe con relationships.itinerary = el suyo.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/StopDocument'
  /stops/{id}:
    get:
      tags:
      - Gestión
      summary: Ver stops
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/StopDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags:
      - Gestión
      summary: Modificar stops
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/StopDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/StopDocument'
    delete:
      tags:
      - Gestión
      summary: Eliminar stops
      responses:
        '204':
          description: Hecho, sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/UpdateRequired'
      description: 'Jefe: solo si no la usa otro itinerario (409 STOP_SHARED).'
