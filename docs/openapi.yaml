components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    PageNumber:
      name: page[number]
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Sort:
      name: sort
      in: query
      description: Campos separados por comas; `-` delante para orden descendente
      schema:
        type: string
    Include:
      name: include
      in: query
      description: Relaciones a incluir, separadas por comas
      schema:
        type: string
  responses:
    BadRequest:
      description: Petición mal formada
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Unauthorized:
      description: No autenticado, token no válido o sesión cerrada
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Forbidden:
      description: Sin permiso
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    NotFound:
      description: No encontrado (o no lo puede ver)
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Conflict:
      description: Conflicto (duplicado, en uso, transición no permitida…)
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    UnsupportedMediaType:
      description: Falta el tipo de contenido JSON:API
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Unprocessable:
      description: Error de validación
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    UpdateRequired:
      description: Actualización obligatoria pendiente (APP_UPDATE_REQUIRED)
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    TooManyRequests:
      description: Demasiadas solicitudes desde ese teléfono
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
  schemas:
    Identifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
        id:
          type: string
    Error:
      type: object
      properties:
        status:
          type: string
        code:
          type: string
        title:
          type: string
        detail:
          type: string
        source:
          type: object
          properties:
            pointer:
              type: string
            parameter:
              type: string
        meta:
          type: object
          additionalProperties: true
    ErrorDocument:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    Links:
      type: object
      additionalProperties: true
    User:
      type: object
      description: Persona. GET /me añade meta.role, meta.chiefItineraryId y meta.memberships.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - users
        id:
          type: string
          readOnly: true
        attributes:
          type: object
          properties:
            firstName:
              type: string
              maxLength: 50
            middleName:
              type: string
              maxLength: 50
              nullable: true
            firstSurname:
              type: string
              maxLength: 50
            secondSurname:
              type: string
              maxLength: 50
            username:
              type: string
            fullName:
              type: string
              readOnly: true
            sex:
              type: string
              enum:
              - F
              - M
              readOnly: true
            photoUrl:
              type: string
              format: uri
              nullable: true
              readOnly: true
              description: Imagen subida (POST …/image); null = ícono
            isAdmin:
              type: boolean
              readOnly: true
            entities:
              type: array
              items:
                type: string
              readOnly: true
            identityCard:
              type: string
              pattern: ^\d{11}$
              description: Carné de identidad. Lo ven la persona, el Administrador y el Jefe de su itinerario.
            birthDate:
              type: string
              format: date
              readOnly: true
            password:
              type: string
              writeOnly: true
            mustChangePassword:
              type: boolean
              readOnly: true
            currentPasswordRequired:
              type: boolean
              readOnly: true
            passwordExpiresAt:
              type: string
              format: date-time
              nullable: true
              readOnly: true
            appVersionCode:
              type: integer
              nullable: true
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
        meta:
          type: object
          additionalProperties: true
        links:
          $ref: '#/components/schemas/Links'
    UserDocument:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
        included:
          type: array
          items:
            type: object
            additionalProperties: true
