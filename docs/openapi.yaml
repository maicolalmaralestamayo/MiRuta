openapi: 3.0.3
info:
  title: MiTransporte API
  version: 2.0.0
  description: 'API de MiTransporte: gestión del transporte de trabajadores.


    - Formato [JSON:API 1.1](https://jsonapi.org/format/) (`application/vnd.api+json`).

    - Autenticación JWT (RFC 7519): token de acceso de 30 min y de renovación de 90 días con rotación.

    - Varias Entidades: cada usuario ve y actúa solo sobre la suya; el Administrador, sobre todas. Lo ajeno responde 404.

    - Sin cuenta, la app se identifica con la cabecera X-Installation (POST /installations).

    - Documentación funcional en `docs/`.'
servers:
- url: https://{host}/api/v1
  variables:
    host:
      default: localhost
security:
- bearerAuth: []
tags:
- name: Autenticación
- name: Cuentas
- name: Sin cuenta
- name: Entidades
- name: Trabajadores
- name: Perfil
- name: Nomencladores
- name: Itinerarios y paradas
- name: Roles
- name: Vehículos
- name: Viajes
- name: Recorrido
- name: Subida
- name: Hijos
- name: Solicitudes
- name: Chats
- name: Avisos
- name: Ajustes
- name: Estadísticas
- name: Actualizaciones
- name: Lote
paths:
  /tokens:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: Usuario + contraseña. Devuelve token de acceso (30 min) y de renovación (90 días). Con X-Installation,
        la instalación y sus conversaciones sin cuenta pasan a la cuenta.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/TokenDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
    delete:
      tags:
      - Autenticación
      summary: Cerrar sesión en todos los dispositivos
      description: Revoca todos los tokens de renovación de la cuenta.
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tokens/refresh:
    post:
      tags:
      - Autenticación
      summary: Renovar tokens
      description: Envía `attributes.refreshToken`. Devuelve un par nuevo y revoca el token de renovación usado (rotación).
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/TokenDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
  /tokens/current:
    delete:
      tags:
      - Autenticación
      summary: Cerrar sesión en este dispositivo
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /password-policy:
    get:
      tags:
      - Cuentas
      summary: Requisitos de la contraseña y del usuario
      description: Público.
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PasswordPolicyDocument'
      security: []
  /users:
    post:
      tags:
      - Cuentas
      summary: Crear la cuenta (paso 1 del registro)
      description: 'Público. Cuatro nombres (obligatorios), usuario y contraseña. La primera cuenta es la del Administrador
        (sin trabajador). Errores: USERNAME_INVALID, USERNAME_TAKEN, PASSWORD_POLICY.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UserDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
    get:
      tags:
      - Cuentas
      summary: Listar cuentas
      description: Solo el Administrador; incluye las que no se unieron a ninguna Entidad.
      parameters:
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Include'
      - name: filter[search]
        in: query
        required: false
        description: Usuario o nombres
        schema:
          type: string
      - name: filter[hasWorker]
        in: query
        required: false
        description: true/false
        schema:
          type: boolean
      - name: filter[active]
        in: query
        required: false
        description: true, false o all
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{id}:
    get:
      tags:
      - Cuentas
      summary: Obtener cuenta
      description: Solo el Administrador.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Cuentas
      summary: Activar o desactivar cuenta
      description: Solo el Administrador. Atributo `active`.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UserDocument'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /activations:
    post:
      tags:
      - Cuentas
      summary: Activar una cuenta creada por un superior
      description: 'Público. "Ya me registró un superior": abreviatura de la Entidad, Pase, código, usuario y contraseña.
        Devuelve los tokens. Datos o código incorrectos: 422 ACTIVATION_INVALID (5 intentos por código).'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ActivationDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
  /installations:
    post:
      tags:
      - Sin cuenta
      summary: Registrar la instalación de la app
      description: Público. Devuelve en meta.header el valor de X-Installation (solo esta vez).
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/InstallationDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/InstallationDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
  /installations/{id}:
    get:
      tags:
      - Sin cuenta
      summary: Obtener instalación
      description: Solo el Administrador.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/InstallationDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Sin cuenta
      summary: Bloquear o desbloquear una instalación
      description: Solo el Administrador. Atributo `blocked`.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/InstallationDocument'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/InstallationDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /guest/access-recoveries:
    post:
      tags:
      - Sin cuenta
      summary: 'No puedo entrar: pedir ayuda'
      description: Con X-Installation. Usuario olvidado, contraseña o los dos; Entidad, Pase y teléfono. La respuesta no dice
        si los datos coinciden. Límite por hora (429).
      parameters:
      - name: X-Installation
        in: header
        required: true
        schema:
          type: string
        description: <id>.<secreto> de la instalación (POST /installations)
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AccessRecoveryDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AccessRecoveryDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /guest/access-recoveries/{id}:
    get:
      tags:
      - Sin cuenta
      summary: Estado de mi solicitud
      description: Con X-Installation. Si se aprobó y olvidó el usuario, trae `username` (y la solicitud termina).
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: X-Installation
        in: header
        required: true
        schema:
          type: string
        description: <id>.<secreto> de la instalación (POST /installations)
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AccessRecoveryDocument'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /guest/access-recoveries/{id}/password:
    post:
      tags:
      - Sin cuenta
      summary: Elegir contraseña nueva tras la aprobación
      description: Con X-Installation. Cierra las demás sesiones y devuelve los tokens.
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: X-Installation
        in: header
        required: true
        schema:
          type: string
        description: <id>.<secreto> de la instalación (POST /installations)
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AccessRecoveryDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TokenDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security: []
  /access-recoveries:
    get:
      tags:
      - Sin cuenta
      summary: Solicitudes "No puedo entrar"
      description: Solo el Administrador. Por defecto, pendientes y aprobadas.
      parameters:
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Include'
      - name: filter[status]
        in: query
        required: false
        description: Estados separados por comas
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AccessRecoveryCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /access-recoveries/{id}:
    get:
      tags:
      - Sin cuenta
      summary: Obtener solicitud
      description: Solo el Administrador.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AccessRecoveryDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Sin cuenta
      summary: Aprobar o rechazar
      description: 'Solo el Administrador, tras verificar a la persona por su cuenta. `status`: approved o rejected.'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/AccessRecoveryDocument'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AccessRecoveryDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /guest/conversations:
    get:
      tags:
      - Sin cuenta
      summary: Mis conversaciones sin cuenta
      description: Con X-Installation.
      parameters:
      - name: X-Installation
        in: header
        required: true
        schema:
          type: string
        description: <id>.<secreto> de la instalación (POST /installations)
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ConversationCollection'
      security: []
    post:
      tags:
      - Sin cuenta
      summary: Escribir al desarrollador sin cuenta
      description: Con X-Installation. `guestName`, `guestPhone`, `body` y la relación `topic` (de destinatario developer).
        Límite de mensajes por hora (429).
      parameters:
      - name: X-Installation
        in: header
        required: true
        schema:
          type: string
        description: <id>.<secreto> de la instalación (POST /installations)
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ConversationDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ConversationDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /guest/conversations/{id}/messages:
    get:
      tags:
      - Sin cuenta
      summary: Mensajes de una conversación sin cuenta
      description: Con X-Installation.
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: X-Installation
        in: header
        required: true
        schema:
          type: string
        description: <id>.<secreto> de la instalación (POST /installations)
      - name: filter[since]
        in: query
        required: false
        description: Posteriores a
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ConversationMessageCollection'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
    post:
      tags:
      - Sin cuenta
      summary: Escribir en una conversación sin cuenta
      description: Con X-Installation. Falla con CONVERSATION_CLOSED si está cerrada.
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: X-Installation
        in: header
        required: true
        schema:
          type: string
        description: <id>.<secreto> de la instalación (POST /installations)
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ConversationMessageDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ConversationMessageDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /entities:
    get:
      tags:
      - Entidades
      summary: Listar entities
      description: Solo el Administrador ve todas; los demás, la suya.
      parameters:
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Include'
      - name: filter[search]
        in: query
        required: false
        description: Abreviatura o nombre
        schema:
          type: string
      - name: filter[active]
        in: query
        required: false
        description: true, false o all
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Entidades
      summary: Crear entities
      description: Solo el Administrador.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/EntityDocument'
      responses:
        '201':
          description: Creado
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /entities/{id}:
    get:
      tags:
      - Entidades
      summary: Obtener entities
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Entidades
      summary: Modificar entities
      description: Solo el Administrador. `active` desactiva o reactiva.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/EntityDocument'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags:
      - Entidades
      summary: Eliminar entities (borrado lógico)
      description: Solo el Administrador.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /entities/lookup:
    get:
      tags:
      - Entidades
      summary: Buscar una Entidad por su abreviatura
      description: Con sesión o con X-Installation. Abreviatura exacta, sin distinguir mayúsculas; devuelve solo abreviatura
        y nombre. 404 ENTITY_NOT_FOUND.
      parameters:
      - name: abbreviation
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /forbidden-words:
    get:
      tags:
      - Nomencladores
      summary: Listar forbidden-words
      description: Solo el Administrador.
      parameters:
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: Correcto
          content:
            application/vnd.api+json:
              schema:
