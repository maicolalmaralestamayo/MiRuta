            additionalProperties: true
        links:
          $ref: '#/components/schemas/Links'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Token:
      type: object
      description: Par de tokens JWT.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - tokens
        id:
          type: string
        attributes:
          type: object
          properties:
            username:
              type: string
              writeOnly: true
            password:
              type: string
              format: password
              writeOnly: true
            deviceName:
              type: string
              nullable: true
            refreshToken:
              type: string
              description: En /tokens/refresh se envía; en las respuestas se devuelve el nuevo
            accessToken:
              type: string
              readOnly: true
            tokenType:
              type: string
              enum:
              - Bearer
              readOnly: true
            expiresIn:
              type: integer
              description: Segundos de validez del token de acceso (1800)
              readOnly: true
            refreshExpiresIn:
              type: integer
              description: Segundos de validez del token de renovación (7776000)
              readOnly: true
        links:
          $ref: '#/components/schemas/Links'
    TokenDocument:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Token'
        included:
