      summary: Comprobar un QR
      description: 'No gasta el código. `purpose`: boarding (chofer, tracking.scan_boarding; con relationships.tripLeg dice
        si es de fuera, si ya subió y qué hijos puede subir) o itinerary_assignment (members.assign_by_qr). Errores 422: QR_INVALID,
        QR_SIGNATURE_INVALID, QR_CERTIFICATE_INVALID (no lo firmó el servidor o es de otra persona), QR_CERTIFICATE_EXPIRED,
        QR_EXPIRED (|t − hora del escaneo| > 120 s), QR_REVOKED (impreso anulado), QR_USER_INACTIVE, QR_SCAN_TIME_INVALID,
