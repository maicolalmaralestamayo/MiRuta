    SettingDefinition:
      type: object
      description: Definición de un ajuste.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - setting-definitions
        id:
          type: string
        attributes:
          type: object
          properties:
            key:
              type: string
            name:
              type: string
            description:
              type: string
              nullable: true
            valueType:
              type: string
              enum:
              - integer
              - boolean
              - string
              - time
              - option
            defaultValue:
              type: string
            minValue:
              type: integer
              nullable: true
            maxValue:
              type: integer
              nullable: true
            minSetting:
              type: string
              nullable: true
              description: Clave del ajuste global que fija el mínimo
            level:
              type: string
              enum:
              - app
              - entity
              description: 'app: solo el Administrador; entity: el Administrador fija el de la app y cada Jefe de Transporte
                el de su Entidad'
            userOverridable:
              type: boolean
            options:
              type: array
              items:
                type: object
                properties:
                  value:
                    type: string
                  name:
                    type: string
        links:
          $ref: '#/components/schemas/Links'
    SettingDefinitionDocument:
      type: object
      required:
      - data
