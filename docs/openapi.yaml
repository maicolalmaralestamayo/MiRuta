      summary: Alta directa en un itinerario con el QR
      description: 'members.assign_by_qr sobre ese itinerario (por defecto, solo el Administrador). La persona debe pertenecer
        a la Entidad (422 NOT_A_MEMBER). Cambia itinerario y parada en esa Entidad (pierde el anterior; no pierde jefaturas)
        y le avisa (itinerary_assigned). El código se gasta: reintento del mismo alta → 200 con meta.repeated; otro uso →
