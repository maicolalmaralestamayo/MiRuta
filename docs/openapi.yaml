          - entity-settings
        id:
          type: string
        attributes:
          type: object
          properties:
            value:
              type: string
            appValue:
              type: string
              readOnly: true
            isCustom:
              type: boolean
              readOnly: true
            editable:
              type: boolean
              readOnly: true
          required:
          - value
        relationships:
          type: object
          properties:
            definition:
              type: object
              properties:
                data:
