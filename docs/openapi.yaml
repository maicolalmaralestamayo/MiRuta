  /offline-scans:
    post:
      tags:
      - QR
      summary: Sincronizar escaneos hechos sin conexión
      description: '`data` es una LISTA (máx. 200) de `offline-scans` con `lid` (id local), `purpose`, `qr`, `scannedAt` (hora
        local del escaneo) y, según el uso, relationships.tripLeg (+ childIds, allowOutsider) o itinerary + stop. Cada uno
        se procesa por separado y la respuesta trae su `status`: accepted, repeated (ya estaba: reintento), discarded (QR_ALREADY_USED
        o ALREADY_BOARDED) o rejected (`code` y `detail`). Nunca falla todo el lote.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/OfflineScan'
      responses:
