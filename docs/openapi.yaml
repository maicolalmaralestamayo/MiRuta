      description: Solicitud. Los atributos y relaciones extra dependen de `type`.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - applications
        id:
          type: string
        attributes:
          type: object
          properties:
            type:
              type: string
              enum:
              - itinerary_membership
              - itinerary_chief
              - driver
              - transport_chief
              - child_addition
              - child_removal
              - absence
              - itinerary_leave
              - itinerary_chief_leave
              - driver_leave
              - transport_chief_leave
              - itinerary_removal
            status:
              type: string
              enum:
              - pending
              - approved
              - rejected
              - cancelled
              description: 'En PATCH: approved, rejected o cancelled'
            resolutionNote:
              type: string
              nullable: true
            resolvedAt:
              type: string
              format: date-time
              nullable: true
              readOnly: true
            childFirstName:
              type: string
              maxLength: 50
              writeOnly: true
              description: Solo child_addition
            childMiddleName:
              type: string
              maxLength: 50
              writeOnly: true
              description: Solo child_addition
            childFirstSurname:
              type: string
              maxLength: 50
              writeOnly: true
              description: Solo child_addition
            childSecondSurname:
              type: string
              maxLength: 50
              writeOnly: true
              description: Solo child_addition
            childBirthDate:
              type: string
              format: date
              writeOnly: true
              description: Solo child_addition
            childFullName:
              type: string
              readOnly: true
            possibleDuplicate:
              type: boolean
              readOnly: true
              description: Pendiente de un niño que coincide con otro de la Entidad en fecha, primer nombre y primer apellido
            assigned:
              type: boolean
              readOnly: true
              description: La creó un superior (asignación o retirada directa)
            startsOn:
              type: string
              format: date
              description: Solo absence
            endsOn:
              type: string
              format: date
              description: Solo absence
            observation:
              type: string
              nullable: true
              description: Solo absence
            createdAt:
              type: string
              format: date-time
              readOnly: true
          required:
          - type
        relationships:
          type: object
          properties:
            worker:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
            createdBy:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
            resolvedBy:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
            itinerary:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
            stop:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
            child:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
            absenceType:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
        links:
          $ref: '#/components/schemas/Links'
    ApplicationDocument:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Application'
        included:
          type: array
          items:
            type: object
            additionalProperties: true
    ApplicationCollection:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
