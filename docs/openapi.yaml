        meta:
          $ref: '#/components/schemas/PageMeta'
    Setting:
      type: object
      description: Valor de un ajuste para toda la app. El id es la clave. Solo el Administrador lo cambia.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - settings
        id:
          type: string
        attributes:
          type: object
          properties:
            value:
              type: string
            editable:
              type: boolean
              readOnly: true
          required:
          - value
        relationships:
          type: object
          properties:
            definition:
              type: object
              properties:
                data:
                  allOf:
                  - $ref: '#/components/schemas/ResourceIdentifier'
                  nullable: true
