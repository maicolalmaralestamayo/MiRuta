# Publica las imágenes del mapa en /tiles/{z}/{x}/{y}.png (lo que pide la app,
# ajuste map_tiles_url) y las guarda en caché en el propio servidor web.
#
# 1) En el bloque http { … } (p. ej. /etc/nginx/conf.d/tiles-cache.conf):
#
#    proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:50m max_size=5g inactive=365d use_temp_path=off;
#
# 2) Dentro del bloque server { … } del sitio de la API, esto:

location ~ ^/tiles/(\d+)/(\d+)/(\d+)\.png$ {
    proxy_pass http://127.0.0.1:8081/styles/miruta/$1/$2/$3.png;
    proxy_cache tiles;
    proxy_cache_valid 200 30d;
    add_header Cache-Control "public, max-age=2592000";
}
