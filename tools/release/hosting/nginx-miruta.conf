# MiRuta en una carpeta /miruta de un sitio con nginx + PHP-FPM (hace lo que
# .htaccess hace en Apache). Copie estas líneas dentro del bloque server { } de
# su sitio; su "root" debe ser la carpeta que contiene miruta/ (p. ej. htdocs).
# Cambie fastcgi_pass por el de su PHP-FPM (p. ej. unix:/run/php/php7.4-fpm.sock).

client_max_body_size 70m;

# Nunca servir el código, la configuración ni los archivos ocultos.
location ^~ /miruta/servidor/ { deny all; }
location ~ /\. { deny all; }

# Las dos páginas sueltas de mantenimiento.
location ~ ^/miruta/(diagnostico|desempaquetar)\.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass 127.0.0.1:9000;
}

# Fotos y APK subidos tal cual; todo lo demás, a la API.
location /miruta/ {
    try_files $uri /miruta/index.php$is_args$args;
}

location = /miruta/index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/miruta/index.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_read_timeout 600;
    fastcgi_pass 127.0.0.1:9000;
}
