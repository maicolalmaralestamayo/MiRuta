# Sitio de la API de MiRuta con nginx + PHP-FPM.
# Copiar a /etc/nginx/sites-available/miruta, ajustar server_name, root y el
# socket de PHP-FPM, enlazar en sites-enabled y recargar nginx.
server {
    listen 80;
    server_name miruta.miempresa.cu;        # su dominio o IP

    root /var/www/miruta-api/public;        # carpeta public de la API
    index index.php;

    # Los APK de las actualizaciones pesan decenas de MB.
    client_max_body_size 200M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;   # ajuste la versión de PHP
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Mapa propio (opcional): ver servidor/mapas/README.md y nginx-tiles.conf.
}
